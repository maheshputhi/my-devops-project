name: DevOps S3 CI-CD
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code from Laptop
      uses: actions/checkout@v4

    - name: Connect to AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change this if you selected a different region in Step 5

    - name: Deploy files to AWS S3
      run: aws s3 sync . s3://my-first-unique-devops-bucket-2026 --exclude ".git*"
